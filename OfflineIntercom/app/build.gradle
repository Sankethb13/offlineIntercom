plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.intercom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.offline.intercom'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs straight away.
            // Replace with your own keystore before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
